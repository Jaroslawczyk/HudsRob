<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Пиксель-аркада</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common/frame.css">
<style>
  #stage { font-family: 'Press Start 2P', monospace; color: #fff; font-size: 12px; line-height: 1.6; image-rendering: pixelated;
    --bg: #0f0f23; --line: #fff; --hi: #ffd800; --red: #ff004d; --green: #00e436; --blue: #29adff; --pink: #ff77a8; }
  #stage .scene { filter: saturate(1.4) contrast(1.1); }
  #stage::after { content: ''; position: absolute; inset: 0; z-index: 100; pointer-events: none;
    background: repeating-linear-gradient(#0000 0 2px, #0003 2px 3px); mix-blend-mode: multiply; }
  .px { position: absolute; z-index: 5; }
  .frame { background: var(--bg); border: 4px solid var(--line); box-shadow: 0 0 0 4px #000, 4px 4px 0 4px #000; padding: 10px 12px; }
  .hudl { left: 16px; top: 16px; }
  .hudl div { display: flex; align-items: center; gap: 10px; margin: 2px 0; }
  .hudl .lab { color: var(--hi); width: 72px; }
  .hearts { color: var(--red); letter-spacing: 2px; }
  .hudr { right: 16px; top: 16px; text-align: right; }
  .hudr .big { font-size: 22px; color: var(--hi); }
  .blink { animation: blink 1s steps(1) infinite; } @keyframes blink { 50% { opacity: 0; } }
  .itembox { right: 16px; bottom: 16px; width: 120px; text-align: center; }
  .itembox .ic { font-size: 40px; line-height: 56px; }
  .pvebox { left: 16px; bottom: 16px; cursor: pointer; }
  .pvebox b { color: var(--green); } .pvebox.off b { color: var(--red); }
  .start { cursor: pointer; left: 50%; bottom: 16px; transform: translateX(-50%); font-size: 10px; color: #ccc; text-align: center; }
  .start span { color: var(--hi); }
  /* npc */
  .npc { left: 16%; top: 40%; cursor: pointer; }
  .npc .bang { position: absolute; left: 12px; top: -40px; color: var(--hi); font-size: 22px; animation: hop .6s steps(2) infinite; }
  @keyframes hop { 50% { transform: translateY(-6px); } }
  .npc .name { position: absolute; top: 100px; left: -30px; width: 120px; text-align: center; font-size: 8px; background: #000a; padding: 2px; }
  .sprite { width: 6px; height: 6px; position: relative; }
  /* dialog */
  .dlg { left: 16px; right: 16px; bottom: 16px; z-index: 40; display: none; gap: 14px; min-height: 150px; }
  .dlg.on { display: flex; }
  .portrait { width: 112px; height: 112px; flex: none; border: 4px solid var(--line); background: #1d2b53; position: relative; }
  .portrait .sprite { position: absolute; left: 14px; top: 14px; }
  .dtext { flex: 1; font-size: 13px; line-height: 2; }
  .dtext .who { color: var(--pink); }
  .opts { display: flex; flex-direction: column; gap: 4px; min-width: 260px; }
  .opt { cursor: pointer; padding-left: 22px; position: relative; white-space: nowrap; }
  .opt.on { color: var(--hi); }
  .opt.on::before { content: '▶'; position: absolute; left: 0; animation: blink .6s steps(1) infinite; }
  .opt.dim { color: #777; }
  /* windows */
  .win { z-index: 50; display: none; }
  .win.on { display: block; }
  .shop { z-index: 50; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 860px; display: none; gap: 14px; }
  .shop.on { display: grid; grid-template-columns: 1.2fr 1fr; }
  .shop h3, .pause h3 { margin: 0 0 10px; color: var(--hi); font-size: 14px; font-weight: 400; }
  .lst .opt { display: flex; justify-content: space-between; padding: 4px 4px 4px 22px; }
  .lst .opt .pr { color: var(--green); } .lst .opt.dim .pr { color: var(--red); }
  .desc { display: flex; flex-direction: column; gap: 10px; }
  .desc .ic { font-size: 64px; text-align: center; line-height: 90px; background: #1d2b53; border: 4px solid #fff; }
  .desc .txt { font-family: 'Pixelify Sans', monospace; font-size: 18px; line-height: 1.3; }
  .meter { display: flex; gap: 2px; } .meter i { width: 10px; height: 12px; background: #333; } .meter i.f { background: var(--green); }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .conf { left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 60; width: 460px; text-align: center; }
  .conf .opts { flex-direction: row; justify-content: center; gap: 40px; margin-top: 14px; min-width: 0; }
  .pause { z-index: 45; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 640px; min-height: 360px; display: none; gap: 20px; }
  .pause.on { display: flex; }
  .pause .side { width: 200px; border-right: 4px dotted #555; padding-right: 14px; }
  .pause .pane { flex: 1; }
  .hs { width: 100%; border-collapse: collapse; } .hs td { padding: 4px 2px; } .hs tr.me td { color: var(--hi); } .hs td:last-child { text-align: right; }
  .hs tr:nth-child(1) td { color: var(--red); } .hs tr:nth-child(2) td { color: var(--pink); } .hs tr:nth-child(3) td { color: var(--blue); }
  .egg { left: 50%; top: 42%; transform: translate(-50%, -50%); z-index: 70; text-align: center; width: 420px; }
  .egg .big { font-size: 96px; line-height: 140px; }
  .egg .big.shake { animation: pxshake .2s steps(2) 8; } @keyframes pxshake { 50% { transform: translateX(8px); } }
  .flash { position: absolute; inset: 0; z-index: 65; background: #fff; display: none; } .flash.on { display: block; animation: fl .4s steps(3) forwards; } @keyframes fl { to { opacity: 0; } }
  .pop { position: absolute; z-index: 80; color: var(--hi); font-size: 16px; pointer-events: none; animation: up 1s steps(6) forwards; text-shadow: 3px 3px 0 #000; }
  @keyframes up { to { transform: translateY(-60px); opacity: 0; } }
  .hint { font-size: 8px; color: #aaa; margin-top: 10px; }
  @container stage (max-height: 450px) {
    #stage { font-size: 9px; } .hudl, .hudr, .itembox, .pvebox, .start, .npc { zoom: .7; }
    .shop, .pause, .conf, .egg { zoom: .6; } .dlg { zoom: .7; width: 1170px; }
  }
</style>
</head>
<body>
<div id="stage">
  <div class="px frame hudl" id="hudl"></div>
  <div class="px frame hudr"><div>ОСТРОВ</div><div class="big" id="tT"></div><div style="color:var(--red)">РЕЙД <span id="tR"></span></div></div>
  <div class="px npc" id="npc"><div class="bang">!</div><div class="sprite" id="npcSprite"></div><div class="name">БАБУШКА ЗИНА</div></div>
  <div class="px frame pvebox" id="pve"></div>
  <div class="px start"><span class="blink">НАЖМИ [E] У ЗИНЫ</span><br>[ESC/КЛИК] ПАУЗА · [P] ЩИТ · [1-4] ПРЕДМЕТ · [M] МИНА</div>
  <div class="px frame itembox" id="itembox"></div>

  <div class="px frame dlg" id="dlg"><div class="portrait"><div class="sprite" id="portrait"></div></div><div class="dtext"><span class="who">ЗИНА:</span> <span id="say"></span></div><div class="opts" id="dopts"></div></div>
  <div class="px frame shop" id="shop"></div>
  <div class="px frame conf win" id="conf"></div>
  <div class="px frame pause" id="pause"></div>
  <div class="px frame egg win" id="egg"></div>
  <div class="flash" id="flash"></div>
</div>
<script src="common/data.js"></script>
<script src="common/frame.js"></script>
<script>
const { S, CUR, RARITY, CATS, PETS, EGGS, DONATE, STATS, RANKS } = BL;
const $ = (s) => document.querySelector(s);

// --- pixel sprites via box-shadow ---
const GRANNY = ['....GGGG....', '...GGGGGG...', '..GSSSSSSG..', '..SSESSESS..', '..SSSSSSSS..', '...SSMMSS...', '....SSSS....', '..PPPPPPPP..', '.PPPWPPWPPP.', '.PPPPPPPPPP.', '.SPPPPPPPPS.', '..PPPPPPPP..', '..BB....BB..'];
const PAL = { G: '#c2c3c7', S: '#ffccaa', E: '#000', M: '#ff004d', P: '#7e2553', W: '#fff1e8', B: '#5f574f' };
function sprite(el, map, size) {
  const sh = [];
  map.forEach((row, y) => [...row].forEach((c, x) => { if (PAL[c]) sh.push(`${x * size}px ${y * size}px 0 ${PAL[c]}`); }));
  el.style.width = el.style.height = size + 'px'; el.style.boxShadow = sh.join(','); el.style.background = 'transparent';
}
sprite($('#npcSprite'), GRANNY, 7); sprite($('#portrait'), GRANNY, 7);

// --- generic keyboard menu stack: each menu = { el, items:[{label, act, dim}], i, back } ---
const stack = [];
const topm = () => stack[stack.length - 1];
function push(m) { m.i = m.i || 0; stack.push(m); paint(); }
function pop() { const m = stack.pop(); if (m && m.onClose) m.onClose(); paint(); }
function paint() { stack.forEach((m) => m.render && m.render()); }
function optsHtml(m) { return m.items.map((it, i) => `<div class="opt ${i === m.i ? 'on' : ''} ${it.dim ? 'dim' : ''}" data-i="${i}">${it.label}</div>`).join(''); }

let typing;
function say(text, cb) {
  clearInterval(typing); const el = $('#say'); el.textContent = ''; let n = 0;
  typing = setInterval(() => { el.textContent = text.slice(0, ++n); if (n >= text.length) { clearInterval(typing); cb && cb(); } }, 22);
}
function talk() {
  if (stack.length) return;
  $('#dlg').classList.add('on');
  say('Здравствуй, сапёр! Опять без кусачек пришёл? Чего надобно?');
  push({ el: $('#dopts'), i: 0,
    items: [
      { label: 'Купить снаряжение', act: () => openShop() },
      { label: 'Яйца питомцев', act: () => openEggs() },
      { label: 'Лавка R$', act: () => openDonate() },
      { label: 'Поболтать', act: () => say(['Красные мины не трогай без лазерного резака, внучок.', 'Зомби-застройщики боятся водомёта!', 'Мост за 1000 монет — а за ним петы и портал…'][Math.floor(Math.random() * 3)]) },
      { label: 'Пока, бабуль', act: () => pop() },
    ],
    render() { this.el.innerHTML = optsHtml(this); },
    onClose() { $('#dlg').classList.remove('on'); },
  });
}
function listMenu(title, list, onPick, side) {
  const shop = $('#shop');
  push({ el: shop, i: 0, items: list,
    render() {
      const cur = this.items[this.i];
      shop.innerHTML = `<div><h3>${title}</h3><div class="lst">${this.items.map((it, i) => `<div class="opt ${i === this.i ? 'on' : ''} ${it.dim ? 'dim' : ''}" data-i="${i}"><span>${it.label}</span><span class="pr">${it.price || ''}</span></div>`).join('')}</div>
        <div class="hint">↑↓ ВЫБОР · ENTER КУПИТЬ · ESC НАЗАД</div></div><div class="desc">${side(cur)}</div>`;
      shop.classList.add('on');
    },
    onClose() { shop.classList.remove('on'); say('Ещё чего-нибудь?'); },
  });
  topm().items.forEach((it) => (it.act = () => onPick(it)));
}
function meter(v) { return `<div class="meter">${Array.from({ length: 10 }, (_, i) => `<i class="${i < v / 10 ? 'f' : ''}"></i>`).join('')}</div>`; }
function openShop() {
  const all = Object.keys(CATS).flatMap((c) => BL.byCat(c));
  listMenu('СНАРЯЖЕНИЕ', all.map((it) => ({ id: it.id, label: (S.owned.has(it.id) ? '✓ ' : '') + it.name.toUpperCase(), price: S.owned.has(it.id) ? 'ЕСТЬ' : (it.cur === 'robux' ? 'R$' + it.price : BL.fmt(it.price) + CUR[it.cur].icon), dim: !S.owned.has(it.id) && !BL.canAfford(it) })),
    (o) => { const it = BL.item(o.id); if (S.owned.has(it.id)) { const r = BL.buy(it.id); say(r.msg.toUpperCase() + '.'); return refreshShop(); } confirm(`КУПИТЬ ${it.name.toUpperCase()} ЗА ${BL.price(it)}?`, () => { const r = BL.buy(it.id); say(r.ok ? 'Держи, внучок! Береги пальцы.' : 'Денег маловато… Иди мины поснимай.'); refreshShop(); }); },
    (o) => { const it = BL.item(o.id); return `<div class="ic">${it.icon}</div><div style="color:${RARITY[it.rarity].color}">${RARITY[it.rarity].name.toUpperCase()}</div><div class="txt">${it.desc}</div>
      <div class="row">СКОР ${meter(it.stats.speed)}</div><div class="row">МОЩЬ ${meter(it.stats.power)}</div><div class="row">ДАЛЬ ${meter(it.stats.range)}</div><div class="row">У ТЕБЯ <span style="color:var(--hi)">${BL.full(S[it.cur])}${CUR[it.cur].icon}</span></div>`; });
}
function refreshShop() { const m = topm(); if (m && m.el === $('#shop')) { const i = m.i; stack.pop(); openShop(); topm().i = i; paint(); } }
function openEggs() {
  listMenu('ЯЙЦА', EGGS.map((e) => ({ id: e.id, label: e.icon + ' ' + e.name.toUpperCase(), price: e.cur === 'robux' ? 'R$' + e.price : BL.fmt(e.price) + CUR[e.cur].icon })),
    (o) => hatch(o.id),
    (o) => { const e = EGGS.find((x) => x.id === o.id); return `<div class="ic">${e.icon}</div><div class="txt">${Object.keys(e.pool).map((k) => `${PETS[k].icon} ${PETS[k].name} — ${e.pool[k]}%`).join('<br>')}</div>`; });
}
function openDonate() {
  listMenu('ЛАВКА R$ (ДЕМО)', DONATE.map((d) => ({ id: d.id, label: d.icon + ' ' + d.name.toUpperCase(), price: S.passes.has(d.id) ? 'ЕСТЬ' : 'R$' + d.price })),
    (o) => { const d = DONATE.find((x) => x.id === o.id); confirm(`ПОТРАТИТЬ R$${d.price}?`, () => { const r = BL.donate(d.id); say(r.ok ? 'Ох, богатенький какой!' : r.msg); }); },
    (o) => { const d = DONATE.find((x) => x.id === o.id); return `<div class="ic">${d.icon}</div><div class="txt">${d.desc || Object.keys(d.give).map((k) => CUR[k].name + ': ' + BL.full(d.give[k])).join('<br>')}</div><div class="row">БАЛАНС <span style="color:var(--green)">R$${S.robux}</span></div>`; });
}
function confirm(q, yes) {
  const c = $('#conf');
  push({ el: c, i: 0, items: [{ label: 'ДА', act: () => { pop(); yes(); } }, { label: 'НЕТ', act: () => pop() }],
    render() { c.innerHTML = `<div>${q}</div><div class="opts">${optsHtml(this)}</div>`; c.classList.add('on'); },
    onClose() { c.classList.remove('on'); } });
}
function hatch(id) {
  const r = BL.hatch(id); if (!r.ok) return say('Не хватает! ' + r.msg);
  const e = EGGS.find((x) => x.id === id), p = r.pets[0], el = $('#egg');
  push({ el, i: 0, items: [{ label: 'ОК', act: () => pop() }],
    render() {}, onClose() { el.classList.remove('on'); say('Ути-пути какой! Заботься о нём.'); } });
  el.innerHTML = `<div class="big shake">${e.icon}</div><div>. . .</div>`; el.classList.add('on');
  setTimeout(() => { $('#flash').classList.remove('on'); void $('#flash').offsetWidth; $('#flash').classList.add('on');
    el.innerHTML = `<div class="big">${p.icon}</div><div style="color:${RARITY[p.rarity].color}">${RARITY[p.rarity].name.toUpperCase()}!</div><div>${p.name.toUpperCase()} x${p.mult}</div><div class="opts" style="align-items:center;margin-top:10px"><div class="opt on" data-i="0">ОК</div></div>`; }, 1700);
}
// pause menu
let pauseTab = 0, rankI = 0;
function openPause() {
  const el = $('#pause');
  const tabs = ['ПРЕДМЕТЫ', 'ПЕТЫ', 'РЕКОРДЫ', 'ЗАДАНИЯ', 'ОПЦИИ'];
  push({ el, i: 0, items: tabs.map((t, i) => ({ label: t, act: () => { if (i === 1) petsMenu(); } })),
    render() {
      const k = this.i; let pane = '';
      if (k === 0) pane = Object.keys(S.equipped).map((c) => `<div class="row"><span>${CATS[c].name.toUpperCase()}</span><span style="color:var(--hi)">${BL.item(S.equipped[c]).icon} ${BL.item(S.equipped[c]).name.toUpperCase()}</span></div>`).join('') + `<br><div class="row"><span>КУПЛЕНО</span><span>${S.owned.size}/${BL.ITEMS.length}</span></div>`;
      if (k === 1) pane = `<div>ENTER — УПРАВЛЯТЬ</div><br>${S.pets.map((p) => `<span title="${PETS[p.key].name}" style="font-size:26px;${p.eq ? '' : 'opacity:.35'}">${PETS[p.key].icon}</span>`).join(' ')}<br><br>МНОЖИТЕЛЬ x${BL.petMult().toFixed(2)}`;
      if (k === 2) pane = `<div style="text-align:center;color:var(--hi)">HI-SCORE · МОНЕТЫ</div><table class="hs">${RANKS.coins.slice(0, 8).map((r, i) => `<tr class="${r.me ? 'me' : ''}"><td>${i + 1}.</td><td>${r.name.toUpperCase().slice(0, 12)}</td><td>${String(r.value).padStart(8, '0')}</td></tr>`).join('')}</table>`;
      if (k === 3) pane = BL.QUESTS.map((q) => `<div>${q.done >= q.need ? '★' : '☆'} ${q.text.toUpperCase()}<br><span style="color:#aaa">${q.done}/${q.need} → ${q.reward}</span></div><br>`).join('');
      if (k === 4) pane = `<div class="row">МУЗЫКА <span style="color:var(--green)">ВКЛ</span></div><div class="row">СКРИМЕРЫ <span style="color:var(--green)">ВКЛ</span></div><div class="row">ЯЗЫК <span>РУС</span></div><div class="row">ОБУЧЕНИЕ <span>ЗАНОВО</span></div>`;
      el.innerHTML = `<div class="side"><h3>ПАУЗА</h3>${optsHtml(this)}<div class="hint">ESC — ИГРАТЬ</div></div><div class="pane">${pane}</div>`; el.classList.add('on');
    },
    onClose() { el.classList.remove('on'); } });
}
function petsMenu() {
  const shop = $('#shop');
  push({ el: shop, i: 0, items: S.pets.map((p) => ({ uid: p.uid })),
    render() {
      this.items = S.pets.map((p) => ({ uid: p.uid, act: () => { const r = BL.togglePet(p.uid); if (!r.ok) flashMsg(r.msg); } }));
      const p = S.pets[this.i], d = PETS[p.key];
      shop.innerHTML = `<div><h3>ПЕТЫ ${S.pets.filter((x) => x.eq).length}/${S.petSlots}</h3><div class="lst">${S.pets.map((x, i) => `<div class="opt ${i === this.i ? 'on' : ''}" data-i="${i}"><span>${PETS[x.key].icon} ${PETS[x.key].name.toUpperCase()}</span><span class="pr">${x.eq ? 'В ОТРЯДЕ' : ''}</span></div>`).join('')}</div><div class="hint">ENTER — ВЗЯТЬ/УБРАТЬ</div></div>
        <div class="desc"><div class="ic">${d.icon}</div><div style="color:${RARITY[d.rarity].color}">${RARITY[d.rarity].name.toUpperCase()}</div><div class="row">БОНУС <span style="color:var(--hi)">x${d.mult}</span></div></div>`;
      shop.classList.add('on');
    }, onClose() { shop.classList.remove('on'); } });
}
function flashMsg(m) { popAt(m, 380, 200); }
function popAt(txt, x, y) { const p = document.createElement('div'); p.className = 'pop'; p.textContent = txt; p.style.left = x + 'px'; p.style.top = y + 'px'; $('#stage').append(p); setTimeout(() => p.remove(), 1000); }

function hud() {
  $('#hudl').innerHTML = `<div><span class="lab">ЖИЗНИ</span><span class="hearts">♥♥♥♡</span></div>
    <div><span class="lab">МОНЕТЫ</span>${String(S.coins).padStart(7, '0')}</div><div><span class="lab">ГЕМЫ</span>${String(S.gems).padStart(4, '0')}</div>
    <div><span class="lab">КРИПТА</span>${BL.full(S.crypto)}</div><div><span class="lab">МИНЫ</span>${S.mines}</div>`;
  const it = BL.item(S.equipped.tools);
  $('#itembox').innerHTML = `<div style="font-size:9px">ПРЕДМЕТ</div><div class="ic">${it.icon}</div><div style="font-size:8px">${it.name.toUpperCase()}</div>`;
  $('#pve').className = 'px frame pvebox' + (S.pve ? '' : ' off'); $('#pve').innerHTML = `ЩИТ: <b>${S.pve ? 'ВКЛ' : 'ВЫКЛ'}</b><br><span style="font-size:8px">[P] ПЕРЕКЛЮЧИТЬ</span>`;
}
function tick() { $('#tT').textContent = BL.mmss(S.treasureAt - Date.now()); $('#tR').textContent = BL.mmss(S.raidAt - Date.now()); }

document.addEventListener('keydown', (e) => {
  const m = topm(); const k = e.key;
  if (m) {
    if (k === 'ArrowDown' || k === 'ArrowRight' && m.el === $('#conf')) { m.i = (m.i + 1) % m.items.length; paint(); e.preventDefault(); }
    else if (k === 'ArrowUp' || k === 'ArrowLeft' && m.el === $('#conf')) { m.i = (m.i - 1 + m.items.length) % m.items.length; paint(); e.preventDefault(); }
    else if (k === 'Enter' || k === ' ' || k === 'z') { m.items[m.i].act && m.items[m.i].act(); e.preventDefault(); }
    else if (k === 'Escape' || k === 'x') pop();
    return;
  }
  if (k === 'Escape') openPause();
  else if (k === 'e' || k === 'у') talk();
  else if (k === 'p' || k === 'з') BL.togglePvE();
  else if (k === 'm' || k === 'ь') { BL.earn(120); popAt('+120', 560, 330); }
  else if (k >= '1' && k <= '4') { const c = Object.keys(CATS)[+k - 1]; c !== 'build' && popAt(BL.item(S.equipped[c]).name.toUpperCase(), 520, 520); }
});
document.addEventListener('mouseover', (e) => { const o = e.target.closest('[data-i]'); const m = topm(); if (o && m && m.el.contains(o) && m.i !== +o.dataset.i) { m.i = +o.dataset.i; paint(); } });
document.addEventListener('click', (e) => {
  const o = e.target.closest('[data-i]'); const m = topm();
  if (o && m && m.el.contains(o)) { m.i = +o.dataset.i; m.items[m.i].act && m.items[m.i].act(); return; }
  if (e.target.closest('#npc')) talk();
  else if (e.target.closest('#pve')) BL.togglePvE();
  else if (!m && e.target.closest('.start')) openPause();
});
BL.on((w) => { if (w === 'tick') return tick(); hud(); });
hud(); tick();
</script>
